name: Deploy Grafo to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: grafo-hostinger-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GRAFO_SITE_URL: https://estudiografo.com
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out the source and deployment history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check source code
        run: npm run lint

      - name: Build the static website
        run: npm run build:hostinger

      - name: Publish the generated website to the Hostinger branch
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/grafo-hostinger-release"

          if git show-ref --verify --quiet refs/remotes/origin/hostinger; then
            git worktree add --detach "$publish_dir" origin/hostinger
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" switch --orphan hostinger
          fi

          rsync --archive --delete --exclude='.git' out/ "$publish_dir/"
          git -C "$publish_dir" config user.name 'github-actions[bot]'
          git -C "$publish_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$publish_dir" add --all
          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" commit -m "Deploy source $GITHUB_SHA"
            git -C "$publish_dir" push origin HEAD:hostinger
          fi

          echo "Published static files for source commit $GITHUB_SHA to the hostinger branch." >> "$GITHUB_STEP_SUMMARY"
          echo 'Hostinger must have automatic deployment enabled for that branch.' >> "$GITHUB_STEP_SUMMARY"
