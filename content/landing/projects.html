<section id="proyectos" class="claro">
  <div class="wrap reveal">
    <div class="eyebrow">Obras y proyectos</div>
    <div class="proyecto-head">
      <h2>Trabajo real, <span class="tono">del papel a la obra.</span></h2>
      <p class="lead">Cada obra abre una galería con el proyecto, los renders y las fotos de la ejecución.</p>
    </div>

    <div class="obras-grid" data-swipe="obras">
      <button type="button" class="obra-card destacada" data-gallery="marino">
        <img src="/images/landing/landing-d7bc8ab19282.jpg" alt="Casa Marino, Benavidez">
        <span class="ver-mas">10 imágenes ↗</span>
        <span class="info">
          <b>Casa Marino</b>
          <span>Benavidez, Tigre · 2025 / 2026</span>
          <span class="alcance">Proyecto · documentación técnica · cómputos · seguimiento de obra</span>
        </span>
      </button>
      <button type="button" class="obra-card" data-gallery="ana">
        <img src="/images/landing/landing-50d2523fc379.jpg" alt="Casa Ana, Rincón de Milberg">
        <span class="ver-mas">8 imágenes ↗</span>
        <span class="info"><b>Casa Ana</b><span>Rincón de Milberg, Tigre · 2019</span></span>
      </button>
      <button type="button" class="obra-card" data-gallery="carmen">
        <img src="/images/landing/landing-184a6ce10688.jpg" alt="Casa Carmen, Victoria">
        <span class="ver-mas">6 imágenes ↗</span>
        <span class="info"><b>Casa Carmen</b><span>Victoria, Gran Buenos Aires · 2023</span></span>
      </button>
      <button type="button" class="obra-card" data-gallery="zarate">
        <img src="/images/landing/landing-b055670d872a.jpg" alt="Propuesta monoambiente en Zárate">
        <span class="ver-mas">3 imágenes ↗</span>
        <span class="info"><b>Monoambiente en Zárate</b><span>Propuesta arquitectónica · 2018</span></span>
      </button>
    </div>
    <div class="swipe-nav" data-swipe-nav="obras">
      <button type="button" data-swipe-prev aria-label="Anterior">←</button>
      <span class="swipe-count"></span>
      <button type="button" data-swipe-next aria-label="Siguiente">→</button>
      <span class="swipe-hint">Deslizá →</span>
    </div>
  </div>
</section>
