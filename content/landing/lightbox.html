<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox-inner">
    <div class="lightbox-frame">
      <button type="button" class="lightbox-close" id="lightboxClose">Cerrar ✕</button>
      <span class="lightbox-tag" id="lightboxTag">Render</span>
      <img id="lightboxImg" src="" alt="">
      <button type="button" class="lightbox-nav prev" id="lightboxPrev" aria-label="Anterior">‹</button>
      <button type="button" class="lightbox-nav next" id="lightboxNext" aria-label="Siguiente">›</button>
    </div>
    <div class="lightbox-meta">
      <b id="lightboxTitle"></b>
      <span id="lightboxCount"></span>
    </div>
  </div>
</div>
